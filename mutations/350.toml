# #350: the peer-ceiling guard proved on planted mutations, predicted before the first run. C1 to
# C4 plant defects in dependabot.yml's ignore list; G1 reorders it, which no test may see. M1 to M7
# plant defects in the guard's own model of npm ranges and of Dependabot's groups.

[[mutation]]
id = "C1"
why = "The TypeScript hold is removed, so Dependabot proposes TypeScript 7 again (#334)."
path = ".github/dependabot.yml"
old = '''
      - dependency-name: "typescript" # typescript-eslint: >=4.8.4 <6.1.0
        update-types: ["version-update:semver-major"]
'''
new = '''
'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = [
    "tests/guards/test_supply_chain.py::test_dependabot_holds_back_exactly_the_lines_a_peer_refuses[typescript]",
]

[[mutation]]
id = "C2"
why = "esbuild is held back by update type, which Dependabot never applies to 0.28 to 0.29."
path = ".github/dependabot.yml"
old = '''        versions: [">=0.29.0"]'''
new = '''        update-types: ["version-update:semver-major"]'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = [
    "tests/guards/test_supply_chain.py::test_dependabot_holds_back_exactly_the_lines_a_peer_refuses[esbuild]",
]

[[mutation]]
id = "C3"
why = "prettier is held back though no peer refuses its next major, so a landable update is hidden."
path = ".github/dependabot.yml"
old = '''
      - dependency-name: "vite" # vitest: ^6.0.0 || ^7.0.0 || ^8.0.0
'''
new = '''
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite" # vitest: ^6.0.0 || ^7.0.0 || ^8.0.0
'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = [
    "tests/guards/test_supply_chain.py::test_dependabot_holds_back_exactly_the_lines_a_peer_refuses[prettier]",
]

[[mutation]]
id = "C4"
why = "The eslint hold names a package the extension does not use, so it holds nothing back."
path = ".github/dependabot.yml"
old = '''      - dependency-name: "eslint" # typescript-eslint'''
new = '''      - dependency-name: "eslint-x" # typescript-eslint'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = [
    "tests/guards/test_supply_chain.py::test_dependabot_holds_back_exactly_the_lines_a_peer_refuses[eslint]",
    "tests/guards/test_supply_chain.py::test_every_ignore_names_a_direct_dependency",
]

[[mutation]]
id = "G1"
why = "Two ignore entries change places: the same holds, so nothing changes."
path = ".github/dependabot.yml"
old = '''
      - dependency-name: "esbuild" # vite: ^0.27.0 || ^0.28.0
        versions: [">=0.29.0"]
      - dependency-name: "eslint" # typescript-eslint: ^8.57.0 || ^9.0.0 || ^10.0.0
        update-types: ["version-update:semver-major"]
'''
new = '''
      - dependency-name: "eslint" # typescript-eslint: ^8.57.0 || ^9.0.0 || ^10.0.0
        update-types: ["version-update:semver-major"]
      - dependency-name: "esbuild" # vite: ^0.27.0 || ^0.28.0
        versions: [">=0.29.0"]
'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "green"

[[mutation]]
id = "M1"
why = "The guard stops excusing a peer that moves in the same all-updates group (#349)."
path = "tests/guards/test_supply_chain.py"
old = '''        if together and "update-types" not in groups[held[0]]:'''
new = '''        if together and False:'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = [
    "tests/guards/test_supply_chain.py::test_the_peer_ceilings_are_the_ones_measured",
    "tests/guards/test_supply_chain.py::test_dependabot_holds_back_exactly_the_lines_a_peer_refuses[vitest]",
    "tests/guards/test_supply_chain.py::test_dependabot_holds_back_exactly_the_lines_a_peer_refuses[@vitest/coverage-v8]",
]

[[mutation]]
id = "M2"
why = "The guard reads a caret on 0.x as reaching the next major, as it does from 1.0 on."
path = "tests/guards/test_supply_chain.py"
old = '''nonzero[0] if nonzero else places'''
new = '''1'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = [
    "tests/guards/test_supply_chain.py::test_interval_reads_a_comparator_as_npm_does",
    "tests/guards/test_supply_chain.py::test_refuses_a_line_a_range_does_not_reach",
    "tests/guards/test_supply_chain.py::test_the_peer_ceilings_are_the_ones_measured",
    "tests/guards/test_supply_chain.py::test_dependabot_holds_back_exactly_the_lines_a_peer_refuses[esbuild]",
]

[[mutation]]
id = "M3"
why = "The guard reads a pre-release bound as its next patch, not as just below its release."
path = "tests/guards/test_supply_chain.py"
old = '''    after = _floor(known) if found["pre"] else _past(known, places)'''
new = '''    after = _past(known, places)'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = ["tests/guards/test_supply_chain.py::test_interval_reads_a_comparator_as_npm_does"]

[[mutation]]
id = "M4"
why = "The guard reads a tilde as a pin to one patch."
path = "tests/guards/test_supply_chain.py"
old = '''_past(known, min(places, 2))'''
new = '''_past(known, places)'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = ["tests/guards/test_supply_chain.py::test_interval_reads_a_comparator_as_npm_does"]

[[mutation]]
id = "M5"
why = "The guard reads a strict upper bound as inclusive."
path = "tests/guards/test_supply_chain.py"
old = '''        "<": (low, _floor(known)),'''
new = '''        "<": (low, _past(known, places)),'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = ["tests/guards/test_supply_chain.py::test_interval_reads_a_comparator_as_npm_does"]

[[mutation]]
id = "M6"
why = "The guard reads a whole range as one set of comparators, ignoring its alternatives."
path = "tests/guards/test_supply_chain.py"
old = '''    for alternative in npm_range.split("||"):'''
new = '''    for alternative in [npm_range]:'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = [
    "tests/guards/test_supply_chain.py::test_admits_a_line_a_range_reaches",
    "tests/guards/test_supply_chain.py::test_the_peer_ceilings_are_the_ones_measured",
]

[[mutation]]
id = "M7"
why = "The guard reads any text as a version, so a form it does not model is judged, not refused."
path = "tests/guards/test_supply_chain.py"
old = '''VERSION_PART = re.compile(r"\d+|[xX*]")'''
new = '''VERSION_PART = re.compile(r".*")'''
suite = "guards"
tests = ["tests/guards/test_supply_chain.py"]
expect = "red"
red = ["tests/guards/test_supply_chain.py::test_interval_refuses_a_form_it_does_not_read"]
