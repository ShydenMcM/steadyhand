# #362: the TypeScript literal-floors reader judges every node of a bound, not only its top. The
# plants live in the guards project, which runs only in CI, so each new branch of the reader is
# removed here and the plants it serves must turn red: M1 judges the top node alone (the reader
# before #362), M2 stops following names, M3 drops reversed matchers, M4 follows property names and
# accessed objects, M5 drops the cycle guard, M6 and M7 put the old top-node test back in the
# floor-constant and comparison checks, M8 lets a function's body count as its value, and M9 puts
# back the over-wide floor-constant check CI refused on the real tree (record-floors run
# 40774351148: floorsFile and mergeFloors). Every plant #362 adds is red under at least one.

[[mutation]]
id = "M1"
why = "A bound is judged by its top node alone, as before #362: a literal in arithmetic, a call, a cast or parentheses passes."
path = "extension/tests/lib/literal-floors.ts"
old = "    found.push(...valueParts(child));\n"
new = ""
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = [
  "extension/tests/guards/literal-floors.test.ts::a floor written as arithmetic is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a literal inside a call is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a cast is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as parentheses is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as arithmetic in a comparison is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a call in a comparison is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a cast in a comparison is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a comparison whose lower side is arithmetic is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor bound to a name declared with arithmetic is refused, naming it",
  "extension/tests/guards/literal-floors.test.ts::a floor bound to a name declared with a name inside a call is refused, naming it",
  "extension/tests/guards/literal-floors.test.ts::a constant named arithmetic (#362) set to a literal is refused",
  "extension/tests/guards/literal-floors.test.ts::a constant named a cast (#362) set to a literal is refused",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a reversed matcher on arithmetic is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a reversed matcher on a cast is refused by line",
]

[[mutation]]
id = "M2"
why = "A name inside a bound is never followed to its declaration, so a literal one name away passes."
path = "extension/tests/lib/literal-floors.ts"
old = "      initializer !== undefined && holdsLiteral(file, initializer, new Set([...seen, part.text]))\n"
new = "      false\n"
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = [
  "extension/tests/guards/literal-floors.test.ts::a floor bound to a name declared with another name is refused, naming it",
  "extension/tests/guards/literal-floors.test.ts::a floor bound to a name declared with a name inside a call is refused, naming it",
  "extension/tests/guards/literal-floors.test.ts::a floor bound to a name declared with a name in a comparison is refused, naming it",
]

[[mutation]]
id = "M3"
why = "A reversed matcher, expect(5).toBeLessThan(n), is never read as the floor it is."
path = "extension/tests/lib/literal-floors.ts"
old = "subject !== undefined && isLiteralValue(file, subject)"
new = "false"
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = [
  "extension/tests/guards/literal-floors.test.ts::a floor written as a reversed matcher is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a negated reversed matcher is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a reversed matcher on a cast is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor bound to a name declared with a reversed matcher's subject is refused, naming it",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a reversed matcher on arithmetic is refused by line",
]

[[mutation]]
id = "M4"
why = "A property's name and the object it is read from are followed as names, so rows.length is read as a declared literal."
path = "extension/tests/lib/literal-floors.ts"
old = "  return !(\n"
new = "  return true || !(\n"
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = [
  "extension/tests/guards/literal-floors.test.ts::a property named like a declared literal is not a literal floor",
  "extension/tests/guards/literal-floors.test.ts::the object of a property read is not a literal floor",
]

[[mutation]]
id = "M5"
why = "Names are followed with no record of those already followed, so a cycle never ends."
path = "extension/tests/lib/literal-floors.ts"
old = " || seen.has(part.text)) {\n"
new = ") {\n"
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = ["extension/tests/guards/literal-floors.test.ts::a cycle of names is not a literal floor"]

[[mutation]]
id = "M6"
why = "A floor constant is judged by its top node alone again, so FLOOR = 400 + 20 is kept."
path = "extension/tests/lib/literal-floors.ts"
old = "      isLiteralValue(file, initializer)\n      ? ["
new = "      isFloor(initializer)\n      ? ["
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = [
  "extension/tests/guards/literal-floors.test.ts::a constant named arithmetic (#362) set to a literal is refused",
  "extension/tests/guards/literal-floors.test.ts::a constant named a cast (#362) set to a literal is refused",
  "extension/tests/guards/literal-floors.test.ts::a constant named a name (#362) set to a literal is refused",
]

[[mutation]]
id = "M7"
why = "A comparison's lower side is judged by its top node alone again."
path = "extension/tests/lib/literal-floors.ts"
old = "holdsLiteral(file, node[side])"
new = "isFloor(node[side])"
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = [
  "extension/tests/guards/literal-floors.test.ts::a floor written as arithmetic in a comparison is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a call in a comparison is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a cast in a comparison is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor written as a comparison whose lower side is arithmetic is refused by line",
  "extension/tests/guards/literal-floors.test.ts::a floor bound to a name declared with a name in a comparison is refused, naming it",
]

[[mutation]]
id = "M8"
why = "A function's body counts as its value, so a bound computed by a local helper holding a literal is refused."
path = "extension/tests/lib/literal-floors.ts"
old = "  if (ts.isFunctionLike(node)) {\n    return [];\n  }\n"
new = ""
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = ["extension/tests/guards/literal-floors.test.ts::a bound from a helper whose body holds a literal is not a literal floor"]

[[mutation]]
id = "M9"
why = "A floor constant holding a literal anywhere is refused, the over-wide check CI refused on floorsFile and mergeFloors."
path = "extension/tests/lib/literal-floors.ts"
old = "      isLiteralValue(file, initializer)\n"
new = "      holdsLiteral(file, initializer)\n"
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = ["extension/tests/guards/literal-floors.test.ts::a floor-named value from a call with a literal is not a literal floor"]

[[mutation]]
id = "M10"
why = "The object an element is read from is followed as a name, so rows[i] is read as a declared literal."
path = "extension/tests/lib/literal-floors.ts"
old = "    (ts.isElementAccessExpression(parent) && parent.expression === node)\n"
new = "    false\n"
suite = "extension-guards"
tests = ["extension/tests/guards/literal-floors.test.ts"]
expect = "red"
red = ["extension/tests/guards/literal-floors.test.ts::the object of an element read is not a literal floor"]
