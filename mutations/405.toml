# #405: the coverage converter takes its type stripper as an argument, so its unit file no longer
# loads amaro (44-61 ms of CPU); the real stripper is the program's, checked in the guards suite and
# run end to end on a report Node wrote in the integration suite.

[[mutation]]
id = "405-G1"
why = "the program's settings stop stripping with amaro"
path = "extension/tests/node-coverage-report.ts"
old = "  strip: stripTypes,\n"
new = "  strip: (source: string) => source,\n"
suite = "extension-guards"
tests = ["extension/tests/guards/node-coverage-report.test.ts"]
expect = "red"
red = [
  "extension/tests/guards/node-coverage-report.test.ts::the settings strip with amaro, each type blanked in place as Node runs it",
]

[[mutation]]
id = "405-I1"
why = "the real stripper leaves the types in"
path = "extension/tests/node-coverage-report.ts"
old = "  transformSync(source, { mode: \"strip-only\" }).code;\n"
new = "  transformSync(source, { mode: \"strip-only\" }).code.length > -1 ? source : source;\n"
suite = "extension-integration"
tests = ["extension/tests/integration/node-coverage.test.ts"]
expect = "red"
red = [
  "extension/tests/integration/node-coverage.test.ts::a TypeScript file Node ran converts at its own positions, an uncalled function unrun",
]
