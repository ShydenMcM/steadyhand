# #394: Node's own coverage of the extension's test, setup and config files, and the guard that no
# test mocks a module, proved on planted mutations predicted before the first run. G1-G6 plant
# holes in the module-mock guard and the report program; I1-I4 in the native run, the converter,
# the build and the config; C1-C2 in the CI steps (a report naming another commit, a native run of
# every project); G0 is a control that changes nothing.

[[mutation]]
id = "G1"
why = "The guard forgets vi.doMock, so a test could mock a module through it."
path = "extension/tests/lib/module-mocks.ts"
old = "  \"doMock\",\n"
new = ""
suite = "extension-guards"
tests = ["extension/tests/guards/module-mocks.test.ts"]
expect = "red"
red = [
  "extension/tests/guards/module-mocks.test.ts::a test reaching vi.doMock is refused",
  "extension/tests/guards/module-mocks.test.ts::a test reaching an optional chain is refused",
  "extension/tests/guards/module-mocks.test.ts::a test reaching a template key is refused",
]

