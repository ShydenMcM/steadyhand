# P1 to P13: one source defect for each properties file whose unit stand-ins #365 changed, each
# breaking a stand-in's laws, which every draw runs, on nearly every draw: the unit pins are not in
# the property suite.

[[mutation]]
id = "365-P1"
why = "A day buys the set joined by union with what is buyable, so stocks outside the set get weights."
path = "packages/steadyhand/src/steadyhand/strategies/buy_and_hold.py"
old = '''        buying = chosen & view.tradable.buyable'''
new = '''        buying = chosen | view.tradable.buyable'''
suite = "properties"
tests = ["tests/properties/test_engine_buy_and_hold.py"]
expect = "red"
red = [
    "tests/properties/test_engine_buy_and_hold.py::test_it_never_sells_and_buys_only_its_set",
]

[[mutation]]
id = "365-P2"
why = "Each booking is taxed on the whole gross as well as its own piece, past the full tax."
path = "packages/steadyhand/src/steadyhand/exemption.py"
old = '''        owed = self._rules.dividend_tax(amount, on=claim.pay_date)'''
new = '''        owed = self._rules.dividend_tax(claim.gross + amount, on=claim.pay_date)'''
suite = "properties"
tests = ["tests/properties/test_engine_exemption.py"]
expect = "red"
red = [
    "tests/properties/test_engine_exemption.py::test_a_claims_tax_never_exceeds_its_full_tax_plus_one_unit_per_extra_booking",
]

