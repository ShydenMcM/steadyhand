# #381: the extension CI guard this story changed, proved on planted mutations predicted before the
# first run. K1 keeps the unit project's coverage as text only, so the coverage job has no
# istanbul report to join; K2 does the same to the guards project; K3 writes the reporter flags in
# the other order, which vitest reads the same, so nothing changes.

[[mutation]]
id = "K1"
why = "The unit project keeps no JSON report, so the gate cannot join the extension's unit coverage."
path = ".github/workflows/ci.yml"
old = "npm test -- --coverage.reporter=text --coverage.reporter=json"
new = "npm test -- --coverage.reporter=text"
suite = "guards"
tests = ["tests/guards/test_extension_ci.py"]
expect = "red"
red = ["tests/guards/test_extension_ci.py::test_the_job_runs_the_workspace_checks_in_order"]

[[mutation]]
id = "K2"
why = "The guards project keeps no JSON report, so the gate cannot join the guards' coverage."
path = ".github/workflows/ci.yml"
old = "npm run test:guards -- --coverage.reporter=text --coverage.reporter=json"
new = "npm run test:guards -- --coverage.reporter=text"
suite = "guards"
tests = ["tests/guards/test_extension_ci.py"]
expect = "red"
red = ["tests/guards/test_extension_ci.py::test_the_guards_job_installs_then_runs_the_guards_alone_with_one_limit"]

[[mutation]]
id = "K3"
why = "The guard's expected text written as two joined pieces instead of one: the same string."
path = "tests/guards/test_extension_ci.py"
old = "    \"npm test\" + KEEP_REPORT,"
new = "    \"npm \" + \"test\" + KEEP_REPORT,"
suite = "guards"
tests = ["tests/guards/test_extension_ci.py"]
expect = "green"
