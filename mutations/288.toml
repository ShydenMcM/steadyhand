# #288 AC 4: the workflow proved on planted mutations, predicted before the first run. P1 plants a
# defect the integration suite must catch; P2 rewrites the code into an equal form no test can see;
# P3 plants one the runner's own integration test must catch; E1 and E2 plant defects the
# extension's integration and guards projects must catch.
# The third proof, an anchor that matches nothing, runs once on a throwaway branch and is not kept
# here, where it would fail every run of this file.

[[mutation]]
id = "P1"
why = "The handover leaves the docs-only fast path, so a docs-only pull request runs everything."
path = "scripts/ci_scope.py"
old = 'FAST_PATH_FILES = frozenset({"HANDOVER.md"})'
new = 'FAST_PATH_FILES = frozenset({"HANDOVER.txt"})'
suite = "integration"
tests = ["tests/integration/scripts/test_ci_scope_git.py"]
expect = "red"
red = [
    "tests/integration/scripts/test_ci_scope_git.py::test_a_docs_only_pull_request_skips_the_expensive_steps",
    "tests/integration/scripts/test_ci_scope_git.py::test_a_change_is_classified_by_every_path_it_touches[docs-only]",
]

[[mutation]]
id = "P2"
why = "The rename and copy letters written in the other order: the same set, so nothing changes."
path = "scripts/ci_scope.py"
old = 'TWO_PATHS = frozenset("RC")'
new = 'TWO_PATHS = frozenset("CR")'
suite = "integration"
tests = ["tests/integration/scripts/test_ci_scope_git.py"]
expect = "green"

[[mutation]]
id = "E1"
why = "Playwright retries a failed test once, turning a real failure into a pass."
path = "extension/playwright.config.ts"
old = "  retries: 0,"
new = "  retries: 1,"
suite = "extension-integration"
tests = ["extension/tests/integration/tool-configs.test.ts"]
expect = "red"
red = ["extension/tests/integration/tool-configs.test.ts::Playwright never retries a failed test"]

[[mutation]]
id = "E2"
why = "The unit script raises vitest's per-test limit with a flag."
path = "extension/package.json"
old = '"test": "vitest run --project unit --coverage",'
new = '"test": "vitest run --project unit --coverage --testTimeout 5000",'
suite = "extension-guards"
tests = ["extension/tests/guards/no-raised-limit.test.ts"]
expect = "red"
red = ["extension/tests/guards/no-raised-limit.test.ts::no npm script sets a limit"]

[[mutation]]
id = "P3"
why = "pytest's exit 2 is named wrongly, so an interrupted run is reported as something else."
path = "scripts/run_mutations.py"
old = 'UNFINISHED = {2: "interrupted",'
new = 'UNFINISHED = {2: "stopped",'
suite = "integration"
tests = ["tests/integration/scripts/test_run_mutations_pytest.py"]
expect = "red"
red = ["tests/integration/scripts/test_run_mutations_pytest.py::test_a_file_that_cannot_be_collected_is_refused_as_interrupted"]
