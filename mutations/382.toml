[[mutation]]
id = "382-C1"
why = "the built manifest names an older Chrome than the code needs"
path = "extension/build.ts"
old = "const MINIMUM_CHROME = \"119\";\n"
new = "const MINIMUM_CHROME = \"118\";\n"
suite = "extension-integration"
tests = ["extension/tests/integration/build.test.ts"]
expect = "red"
red = [
  "extension/tests/integration/build.test.ts::the manifest is Manifest V3 at the workspace's version, asking for no permission",
]
