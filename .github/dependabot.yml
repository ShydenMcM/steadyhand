version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Dependabot treats actions/cache, actions/cache/restore and actions/cache/save as
      # separate dependencies. This group moves every sub-path of one repo together. It must
      # stay above the patch group, because the first matching group wins.
      actions-cache:
        patterns: ["actions/cache*"]
      actions-patch:
        update-types: ["patch"]

  - package-ecosystem: "npm"
    directory: "/extension"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # @types/node describes the Node that CI runs (setup-node's node-version), so a new major
    # would let tsc accept an API CI's Node lacks (#270). It moves with the runtime, by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # vitest and @vitest/coverage-v8 each pin the other's exact version, so a PR moving one
      # alone cannot install. This group moves them together; it stays above the catch-all,
      # because the first matching group wins.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
