version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Dependabot treats actions/cache, actions/cache/restore and actions/cache/save as
      # separate dependencies. This group moves every sub-path of one repo together. Dependabot
      # does not take the first group that matches: it scores them, and a group with no patterns
      # outranks any wildcard, so the patch group excludes these by the same pattern (#349).
      actions-cache:
        patterns: ["actions/cache*"]
      actions-patch:
        update-types: ["patch"]
        exclude-patterns: ["actions/cache*"]

  - package-ecosystem: "npm"
    directory: "/extension"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # @types/node describes the Node that CI runs (.nvmrc, read by setup-node), so a new major
    # would let tsc accept an API CI's Node lacks (#270). It moves with the runtime, by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Each next breaking line below is refused by a peer range in the lock, so a pull request
      # moving to it cannot install (#350). The supply-chain guard turns red when the peer widens
      # its range, and the entry goes. Dependabot reads 0.28 to 0.29 as minor, hence `versions`.
      - dependency-name: "esbuild" # vite: ^0.27.0 || ^0.28.0
        versions: [">=0.29.0"]
      - dependency-name: "acorn" # acorn-jsx: ^6.0.0 || ^7.0.0 || ^8.0.0
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint" # typescript-eslint: ^8.57.0 || ^9.0.0 || ^10.0.0
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript" # typescript-eslint: >=4.8.4 <6.1.0
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite" # vitest: ^6.0.0 || ^7.0.0 || ^8.0.0
        update-types: ["version-update:semver-major"]
    groups:
      # vitest and @vitest/coverage-v8 each pin the other's exact version, so a PR moving one
      # alone cannot install. This group moves them together. Dependabot scores the groups that
      # match rather than taking the first, and a group with no patterns outranks any wildcard,
      # so the catch-all excludes them by the same patterns (#349).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["vitest", "@vitest/*"]
