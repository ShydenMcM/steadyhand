# Throwaway (#290 AC6, never merged): each moved property, at its full count in the properties
# suite, catches a mutation of the code it checks. One job per mutation.
name: mutate-290

on:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.18"

jobs:
  mutate:
    name: mutate ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        id: [M01, M02, M03, M04, M05, M06, M07, M08, M09, M10, M11, M12, M13, M14, M15, M16, M17, M18, M19, M20, M21, M22, M23, M24, M25, M26, M27, M28, M29, M30]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: The mutation's property goes red
        env:
          ID: ${{ matrix.id }}
        run: python3 .github/mutate_290.py "$ID"
