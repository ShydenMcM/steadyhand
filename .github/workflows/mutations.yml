name: mutations

# Planted mutations of the non-unit suites (#288), a required check. Shyden's rules: only unit tests
# run on the laptop (2026-10-09), so a mutation judged by a guards, integration or properties test,
# or by the extension's guards or integration project, runs here; and it must be run (2026-10-16).
# Every pull request runs the mutation files under `mutations/` that it adds or changes, and fails
# when it adds or changes a non-unit test file that none of them targets. A pull request touching
# neither passes at the plan, saying how many paths it judged. A dispatch on a branch runs the one
# file it names. Each target runs clean first, then each mutation is applied, judged against its
# prediction and put back (`scripts/run_mutations.py`). The table goes to the job summary and the
# `mutations-report` artifact. It holds no secret and only reads.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      file:
        description: "The mutation file to run, such as mutations/288.toml"
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.12.18"

# Every run step is traced (#384, Shyden 2026-10-22: workflow files are code, measured from a run on
# the same commit, shell traced line by line). This shell writes, per step,
# $RUNNER_TEMP/workflow-trace/<job>/<GITHUB_ACTION>: a header (sha, then the script's line count)
# and the line number of each command bash's DEBUG trap sees in the step's own script, never its
# text, since a traced command shows secrets expanded. GitHub reads this value with .NET's argument
# rules and string.Format, so the bash code inside holds no brace and only escaped double quotes.
# scripts/workflow_coverage.py reads the traces back.
defaults:
  run:
    shell: >-
      bash --noprofile --norc -eo pipefail -c
      "__wt_t=\"$RUNNER_TEMP/workflow-trace/$GITHUB_JOB/$GITHUB_ACTION\";
      mkdir -p \"$(dirname \"$__wt_t\")\";
      printf 'sha %s\nlines %s\n' \"$GITHUB_SHA\" \"$(grep -c '' \"$0\")\" > \"$__wt_t\";
      __wt_s=\"$0\";
      set -T;
      trap 'if [ \"$BASH_SOURCE\" = \"$__wt_s\" ]; then echo \"$LINENO\" >> \"$__wt_t\"; fi' DEBUG;
      . \"$0\"" {0}

jobs:
  mutations:
    name: mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Standard library only, on the runner's own python3, before anything is installed.
      - name: "Plan: which mutation files must run?"
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILE: ${{ inputs.file }}
        run: python3 scripts/run_mutations.py --plan "$EVENT_NAME"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.plan.outputs.run == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: steps.plan.outputs.run == 'true'
      # The extension's guards and integration projects run under vitest in the workspace.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # No install script runs: a dependency's postinstall is code nobody reviewed.
      - run: npm ci --ignore-scripts
        if: steps.plan.outputs.run == 'true'
        working-directory: extension
      - name: Run the mutations
        if: steps.plan.outputs.run == 'true'
        # 3 min 49 s to 5 min 35 s measured with every mutation file run (PR #342); about four times
        # the slowest (#288).
        timeout-minutes: 23
        run: |
          mapfile -t files < mutation-files.txt
          uv run --locked python scripts/run_mutations.py "${files[@]}"
      - name: Keep the report
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutations-report
          path: mutations-report.md
          if-no-files-found: error
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7
