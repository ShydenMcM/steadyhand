name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.18"

# Every run step is traced (#384, Shyden 2026-10-22: workflow files are code, measured from a run on
# the same commit, shell traced line by line). This shell writes, per step,
# $RUNNER_TEMP/workflow-trace/<job>/<GITHUB_ACTION>: a header (sha, then the script's line count)
# and the line number of each command bash's DEBUG trap sees in the step's own script, never its
# text, since a traced command shows secrets expanded. GitHub reads this value with .NET's argument
# rules and string.Format, so the bash code inside holds no brace and only escaped double quotes.
# scripts/workflow_coverage.py reads the traces back.
defaults:
  run:
    shell: >-
      bash --noprofile --norc -eo pipefail -c
      "__wt_t=\"$RUNNER_TEMP/workflow-trace/$GITHUB_JOB/$GITHUB_ACTION\";
      mkdir -p \"$(dirname \"$__wt_t\")\";
      printf 'sha %s\nlines %s\n' \"$GITHUB_SHA\" \"$(grep -c '' \"$0\")\" > \"$__wt_t\";
      __wt_s=\"$0\";
      set -T;
      trap 'if [ \"$BASH_SOURCE\" = \"$__wt_s\" ]; then echo \"$LINENO\" >> \"$__wt_t\"; fi' DEBUG;
      . \"$0\"" {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.docs_only != 'true'
      - run: uv run --locked ruff check
        if: steps.scope.outputs.docs_only != 'true'
      - run: uv run --locked ruff format --check
        if: steps.scope.outputs.docs_only != 'true'
      - run: uv run --locked mypy
        if: steps.scope.outputs.docs_only != 'true'
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.docs_only != 'true'
      - name: The unit suite, measured
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/coverage-report"
          uv run --locked pytest -W error --cov --cov-report=term-missing --cov-report="json:${RUNNER_TEMP}/coverage-report/coverage.json"
          git rev-parse HEAD > "${RUNNER_TEMP}/coverage-report/sha.txt"
      # The coverage job joins every suite's report (#381); this one names the commit it measured.
      - name: Keep the coverage report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.python }}
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 7
      # The unit limits are judged without coverage, whose tracer would be timed with the code
      # (#285: each file's load). The run under coverage reports loads but judges none.
      - name: Unit limits, judged without coverage
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run --locked pytest -W error -p no:cacheprovider
      # The ten-year backtest is timed on its own: under coverage's tracing it would time the
      # tracer, which roughly triples the run.
      # Its one limit (#323): 13-29 s measured on CI, so two minutes, about four times the slowest.
      - name: Performance, a ten-year backtest in under 30 seconds
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 2
        run: uv run --locked pytest -W error -m perf -p no:cacheprovider
      # The same tests again under coverage (#374 AC9, Shyden 2026-10-22: "Two runs, one judges
      # time"): --perf-measured judges no time and refuses a run coverage does not trace, and the
      # step above refuses one it does (tests/plugins/perf_budget.py). No limit of its own, as the
      # unit job's measured run has none, so the tracer is never timed.
      - name: Performance, measured
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/coverage-perf"
          uv run --locked pytest -W error -m perf -p no:cacheprovider --perf-measured --cov --cov-report="json:${RUNNER_TEMP}/coverage-perf/coverage.json"
          git rev-parse HEAD > "${RUNNER_TEMP}/coverage-perf/sha.txt"
      # The coverage job joins every suite's report (#381); this one names the commit it measured.
      - name: Keep the performance coverage report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-perf-${{ matrix.python }}
          path: ${{ runner.temp }}/coverage-perf
          if-no-files-found: error
          retention-days: 7
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.docs_only != 'true'
      - name: Audit every locked dependency, dev tools included
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          uv export --locked --format requirements-txt --no-emit-workspace \
            --output-file "${RUNNER_TEMP}/requirements-audit.txt"
          uv run --locked pip-audit --strict --disable-pip -r "${RUNNER_TEMP}/requirements-audit.txt"
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv build --all-packages --out-dir dist
        if: steps.scope.outputs.docs_only != 'true'
      - name: Both packages built a wheel and an sdist
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          ls dist
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
      - name: The IDX wheel carries its rule data
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          unzip -l dist/steadyhand_idx-*.whl > "${RUNNER_TEMP}/idx-wheel.txt"
          for table in tick_sizes auto_reject fees holidays; do
            grep -q "steadyhand_idx/data/${table}.toml" "${RUNNER_TEMP}/idx-wheel.txt"
          done
      - name: The engine wheel installs and imports with nothing else
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          uv venv "${RUNNER_TEMP}/engine-only"
          uv pip install --python "${RUNNER_TEMP}/engine-only" dist/steadyhand-*.whl
          "${RUNNER_TEMP}/engine-only/bin/python" -c "import steadyhand; print(steadyhand.__version__)"
      - name: Both wheels ship every lesson, and the catalogue loads from them
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          expected="$(find packages/*/src/*/training/lessons -name '*.md' | wc -l)"
          test "${expected}" -gt 0
          uv venv "${RUNNER_TEMP}/lessons"
          uv pip install --python "${RUNNER_TEMP}/lessons" dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/lessons/bin/python" - "${expected}" <<'PY'
          import sys
          from steadyhand_idx.training import catalogue
          lessons = catalogue().lessons()
          outside = [lesson.origin for lesson in lessons if "site-packages" not in lesson.origin]
          assert outside == [], outside
          assert len(lessons) == int(sys.argv[1]), (len(lessons), sys.argv[1])
          print(len(lessons), "lessons load from the installed wheels")
          PY
      - name: The engine wheel ships every strategy guide, and the installed command prints one
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          expected="$(find packages/steadyhand/src/steadyhand/strategies/guides -name '*.md' | wc -l)"
          test "${expected}" -gt 0
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/lessons/bin/python" - "${expected}" <<'PY'
          import sys
          from steadyhand import GUIDES, STRATEGIES, guide
          assert "site-packages" in str(GUIDES), GUIDES
          shipped = sorted(entry.name for entry in GUIDES.iterdir() if entry.name.endswith(".md"))
          assert shipped == sorted(f"{name}.md" for name in STRATEGIES), shipped
          assert len(shipped) == int(sys.argv[1]), (shipped, sys.argv[1])
          for name in STRATEGIES:
              assert guide(name).startswith(f"# {name}\n"), name
          print(len(shipped), "strategy guides ship in the engine wheel")
          PY
          STEADYHAND_HOME="${RUNNER_TEMP}/home" "${RUNNER_TEMP}/lessons/bin/steadyhand-idx" \
            explain buy-and-hold > "${RUNNER_TEMP}/explain.txt"
          head -1 "${RUNNER_TEMP}/explain.txt" | grep -qx "# buy-and-hold"

  # The TypeScript extension (spec §3, §12.1). Every tool runs inside extension/, so none walks
  # into the fast-path files the lock makes unreadable (#264).
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7
  extension:
    name: extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # No install script runs: a dependency's postinstall is code nobody reviewed.
      - run: npm ci --ignore-scripts
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension
      - run: npm run lint
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension
      - run: npm run format:check
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension
      - run: npm run typecheck
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension
      - name: The unit project, measured
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension
        run: |
          npm test -- --coverage.reporter=text --coverage.reporter=json --coverage.reportsDirectory="${RUNNER_TEMP}/coverage-report"
          git rev-parse HEAD > "${RUNNER_TEMP}/coverage-report/sha.txt"
      # The coverage job joins every suite's report (#381); this one names the commit it measured.
      - name: Keep the coverage report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-extension-unit
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 7
      # The unit limits, judged without coverage (#285: each file's load).
      - run: npm run test:limits
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension
      - run: npm run build
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension

  # The whole-repo guards (#285): every test that reads the tracked tree to check a rule across
  # the code, in its own suite, with one limit at its step. The unit rules bind everything else.
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7
  guards:
    name: guards (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.docs_only != 'true'
      - name: The whole-repo guards
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 1
        run: uv run --locked pytest -W error --suite guards -p no:cacheprovider
      # The guards again under coverage (#381), whose tracer the limit above must not time, as the
      # unit job does: the guard files and the readers only they run are measured here.
      - name: The whole-repo guards, measured
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/coverage-report"
          uv run --locked pytest -W error --suite guards -p no:cacheprovider --cov --cov-report="json:${RUNNER_TEMP}/coverage-report/coverage.json"
          git rev-parse HEAD > "${RUNNER_TEMP}/coverage-report/sha.txt"
      # The coverage job joins every suite's report (#381); this one names the commit it measured.
      - name: Keep the coverage report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-guards-${{ matrix.python }}
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 7
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7

  extension-guards:
    name: extension-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension
      - name: The whole-repo guards
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 1
        working-directory: extension
        run: |
          npm run test:guards -- --coverage.reporter=text --coverage.reporter=json --coverage.reportsDirectory="${RUNNER_TEMP}/coverage-report"
          git rev-parse HEAD > "${RUNNER_TEMP}/coverage-report/sha.txt"
      # The coverage job joins every suite's report (#381); this one names the commit it measured.
      - name: Keep the coverage report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-extension-guards
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 7

  # The integration suite (#286): every test whose real case needs a process (real git, the
  # installed console script, two processes racing for a lock), and every long real run over the
  # recorded golden window (#292), in its own suite, with one limit at its step. A unit run refuses
  # every process and outside connection, and keeps a short stand-in of each long run.
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7
  integration:
    name: integration (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.docs_only != 'true'
      - name: The integration suite
        if: steps.scope.outputs.docs_only != 'true'
        # 31 s with the golden window's long real runs (#292; PR #316, run 38331680081).
        timeout-minutes: 3
        run: uv run --locked pytest -W error --suite integration -p no:cacheprovider
      # The suite again under coverage (#374), whose tracer the limit above must not time; the
      # scripts it starts as programs are measured too (pyproject: patch = subprocess).
      - name: The integration suite, measured
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/coverage-report"
          uv run --locked pytest -W error --suite integration -p no:cacheprovider --cov --cov-report="json:${RUNNER_TEMP}/coverage-report/coverage.json"
          git rev-parse HEAD > "${RUNNER_TEMP}/coverage-report/sha.txt"
      # The coverage job joins every suite's report (#381); this one names the commit it measured.
      - name: Keep the coverage report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-integration-${{ matrix.python }}
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 7
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7

  extension-integration:
    name: extension-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: extension
      - name: The integration suite
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 1
        working-directory: extension
        run: npm run test:integration

  # Develop's deploy (spec §12.1): the extension zip, its build provenance attested and then
  # verified here, on the run that made it. It always runs in full (#218).
  # Every Hypothesis property at its full count, drawing fresh cases each run (#290), in its own
  # suite with one limit at its step and coverage off. Unit keeps a fast stand-in of each.
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7
  properties:
    name: properties (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.docs_only != 'true'
      - name: The properties suite
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 2
        run: uv run --locked pytest -W error --suite properties -p no:cacheprovider
      # The suite twice more under coverage (#374), unlimited so no limit times the tracer: it
      # draws fresh random cases each run, so the coverage job joins every report once with each
      # run and fails on a line whose verdict differs (Shyden 2026-10-22: wobble measured).
      - name: The properties suite, measured twice
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/coverage-report" "${RUNNER_TEMP}/coverage-report-again"
          uv run --locked pytest -W error --suite properties -p no:cacheprovider --cov --cov-report="json:${RUNNER_TEMP}/coverage-report/coverage.json"
          uv run --locked pytest -W error --suite properties -p no:cacheprovider --cov --cov-report="json:${RUNNER_TEMP}/coverage-report-again/coverage.json"
          git rev-parse HEAD | tee "${RUNNER_TEMP}/coverage-report/sha.txt" > "${RUNNER_TEMP}/coverage-report-again/sha.txt"
      # The coverage job joins every suite's report (#381); these name the commit they measured.
      - name: Keep the coverage report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-properties-${{ matrix.python }}
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 7
      - name: Keep the second coverage report
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-properties-again-${{ matrix.python }}
          path: ${{ runner.temp }}/coverage-report-again
          if-no-files-found: error
          retention-days: 7
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: deploy-dev
    # A pull request runs it too, as a rehearsal, so every line of it is measured before it merges
    # (#384, Shyden 2026-10-22: "Run them on the PR commit", "Attest PR builds too"). A rehearsal's
    # attestation names the pull request's own ref, never refs/heads/develop.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    needs:
      [
        lint,
        test,
        audit,
        build,
        extension,
        guards,
        extension-guards,
        integration,
        extension-integration,
        properties,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: dev
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - name: Zip the built extension
        id: zip
        working-directory: extension/dist
        env:
          ZIP: ${{ runner.temp }}/steadyhand-extension-${{ github.sha }}.zip
        run: |
          zip -X -r -q "${ZIP}" .
          unzip -l "${ZIP}"
          echo "path=${ZIP}" >> "${GITHUB_OUTPUT}"
      - name: Attest the zip's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.path }}
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
        # gh prints nothing on success, so the JSON verdict is kept and checked to name this zip.
        run: |
          gh attestation verify "${ZIP}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" --source-ref "${GITHUB_REF}" --format json > "${RUNNER_TEMP}/verified.json"
          read -r digest _ < <(sha256sum "${ZIP}")
          jq -e --arg digest "${digest}" 'any(.[].verificationResult.statement.subject[]; .digest.sha256 == $digest)' "${RUNNER_TEMP}/verified.json"
          echo "verified: ${ZIP##*/} sha256:${digest}"
      - name: Keep the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          if-no-files-found: error
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: coverage
    # Which lines of the workflows ran on this commit (#384), read once every other job has finished
    # and kept its trace. #381's gate joins this with the code's coverage. This job keeps no trace of
    # its own: its last step reads its own steps' traces where they were written.
    if: ${{ !cancelled() }}
    needs:
      [
        lint,
        test,
        audit,
        build,
        extension,
        guards,
        extension-guards,
        integration,
        extension-integration,
        properties,
        deploy-dev,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Scope: may this docs-only change skip the rest?"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py "$EVENT_NAME"
      - name: "Lock the docs-only fast path: no later step may read it"
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/lock_fast_path.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
        if: steps.scope.outputs.docs_only != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.scope.outputs.docs_only != 'true'
        with:
          pattern: workflow-trace-*
          path: ${{ runner.temp }}/traces
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.scope.outputs.docs_only != 'true'
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage
      - name: The hand-started workflows this pull request changes, read from their runs on its commit
        if: steps.scope.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked python scripts/workflow_runs.py --event "${EVENT_NAME}" --repo "${GITHUB_REPOSITORY}" --branch "coverage/${HEAD_REF}" --sha "${HEAD_SHA}" --out "${RUNNER_TEMP}/workflow-coverage"
      # The gate (#381): this run's own workflow lines are read, then every report is judged against
      # tests/coverage_record.json and, on a pull request, every changed line. Both begin on one
      # line: this step's trace reaches only the line it is on when the reader reads it (#384).
      - name: Every file matches the coverage record and every changed line ran
        if: steps.scope.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > "${RUNNER_TEMP}/jobs.json"
          uv run --locked python scripts/workflow_coverage.py --workflow .github/workflows/ci.yml --jobs "${RUNNER_TEMP}/jobs.json" --sha "${GITHUB_SHA}" --traces "${RUNNER_TEMP}/traces" --own-traces --out "${RUNNER_TEMP}/workflow-coverage/ci.json" && uv run --locked python scripts/coverage_gate.py --event "${EVENT_NAME}" --sha "${GITHUB_SHA}" --head-sha "${HEAD_SHA:-$GITHUB_SHA}" --reports "${RUNNER_TEMP}/coverage" --workflow "${RUNNER_TEMP}/workflow-coverage"
