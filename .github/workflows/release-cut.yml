# A pull request into main merges only a frozen release/* cut (#400, shyden-labs/repo-template#86).
# main is not strict, because each release merge lands on main and never on squash-only develop;
# this job proves instead what strict proved: that what lands is exactly what CI tested on develop.
#
# pull_request_target runs the default branch's own copy of this workflow and checks out the
# default branch, never the pull request: the job fetches the pull request's merge ref as git
# data and runs none of its code. It posts its verdict as the release-cut commit status on the
# head, which main requires. uv runs with no cache, so nothing a pull request wrote is restored.
name: release-cut
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  statuses: write

env:
  UV_VERSION: "0.12.18"

jobs:
  judge-release-cut:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # The default branch, with every branch's history: the check asks git about origin/develop
      # and origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # uv installs the .python-version pin; the check imports the standard library alone.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # The head ref is text the pull request's author chose: it reaches the shell through env,
      # never through an expression.
      - name: Judge the release cut and post its status
        env:
          # A fork's full name, refused before anything is posted; empty once the fork is deleted.
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project scripts/release_cut.py "$HEAD_REPOSITORY" "$HEAD_REF" "$HEAD_SHA" "$PR_NUMBER"
