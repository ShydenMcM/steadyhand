name: record-floors

# The floors recorder (#285). Shyden's rulings, every project: "A CI job records" (2026-10-09) and
# "CI records, laptop commits" (2026-10-12). Labelling a pull request `record-floors` runs every
# extension suite and every Python suite but live (#272) in record mode on it and uploads the
# raised `floors.json`; on the laptop, `npm run floors:fetch <run id>` writes it for review and a
# commit. It is never one of the checks the floors feed, and it holds no key that could push.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.18"

jobs:
  record:
    name: record
    if: github.event.label.name == 'record-floors'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: extension
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: npm run floors:record
        working-directory: extension
      - name: Keep the recorded floors
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floors
          path: extension/tests/floors.json
          if-no-files-found: error
