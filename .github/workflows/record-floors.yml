name: record-floors

# The floors recorder (#285). Shyden's rulings, every project: "A CI job records" (2026-10-09) and
# "CI records, laptop commits" (2026-10-12), and "a CI bot never pushes to a branch: it measures
# a scratch ref and returns an artifact" (2026-10-21, #367). The flow:
#   1. commit locally and do not push the branch;
#   2. git push origin HEAD:refs/floors/<branch>   (a scratch ref: no PR, push or deploy run);
#   3. gh workflow run record-floors.yml --ref develop -f ref=refs/floors/<branch>
#      (GitHub starts no run on a push to that ref and its dispatch API refuses it, measured
#      2026-10-21, so the ref is this workflow's input and the job checks it out);
#   4. npm run floors:fetch <run id> writes the raised floors.json and prints the commit lines;
#   5. fold them into the unpushed commit, push the branch once normally, then
#      git push origin --delete refs/floors/<branch>.
# It runs every extension suite in record mode. It is never one of the checks the floors feed, it
# holds no key that could push, and it pushes nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The scratch ref to measure: refs/floors/<branch>"
        required: true
        type: string

permissions:
  contents: read

# Every run step is traced (#384, Shyden 2026-10-22: workflow files are code, measured from a run on
# the same commit, shell traced line by line). This shell writes, per step,
# $RUNNER_TEMP/workflow-trace/<job>/<GITHUB_ACTION>: a header (sha, then the script's line count)
# and the line number of each command bash's DEBUG trap sees in the step's own script, never its
# text, since a traced command shows secrets expanded. GitHub reads this value with .NET's argument
# rules and string.Format, so the bash code inside holds no brace and only escaped double quotes.
# scripts/workflow_coverage.py reads the traces back.
defaults:
  run:
    shell: >-
      bash --noprofile --norc -eo pipefail -c
      "__wt_t=\"$RUNNER_TEMP/workflow-trace/$GITHUB_JOB/$GITHUB_ACTION\";
      mkdir -p \"$(dirname \"$__wt_t\")\";
      printf 'sha %s\nlines %s\n' \"$GITHUB_SHA\" \"$(grep -c '' \"$0\")\" > \"$__wt_t\";
      __wt_s=\"$0\";
      set -T;
      trap 'if [ \"$BASH_SOURCE\" = \"$__wt_s\" ]; then echo \"$LINENO\" >> \"$__wt_t\"; fi' DEBUG;
      . \"$0\"" {0}

jobs:
  record:
    name: record
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Measure only a scratch ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            refs/floors/?*) ;;
            *) echo "::error::record-floors measures only a scratch ref refs/floors/<branch>, not '$REF'"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: extension
      - run: npm run floors:record
        working-directory: extension
      - name: Keep the recorded floors
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floors
          path: |
            extension/tests/floors.json
            extension/tests/floors-commit-lines.txt
          if-no-files-found: error
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7
