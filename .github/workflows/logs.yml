name: logs

# The logs suite (#336, Shyden 2026-10-16, every project: "separate test suite for logging and
# auditing. run in ci as a pre-requisite to a release"): every check of what the paper account's
# audit trails write, keep, refuse or replay (audit, runs, day_reports in state.sqlite), at its
# full input. It is not a pull request gate and runs on none: it is started by hand on a named
# ref, and a release fails unless it passed on the release head (#245). Unit keeps a fast stand-in
# of each check, so every pull request still runs the same logic.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logs
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.18"

# Every run step is traced (#384, Shyden 2026-10-22: workflow files are code, measured from a run on
# the same commit, shell traced line by line). This shell writes, per step,
# $RUNNER_TEMP/workflow-trace/<job>/<GITHUB_ACTION>: a header (sha, then the script's line count)
# and the line number of each command bash's DEBUG trap sees in the step's own script, never its
# text, since a traced command shows secrets expanded. GitHub reads this value with .NET's argument
# rules and string.Format, so the bash code inside holds no brace and only escaped double quotes.
# scripts/workflow_coverage.py reads the traces back.
defaults:
  run:
    shell: >-
      bash --noprofile --norc -eo pipefail -c
      "__wt_t=\"$RUNNER_TEMP/workflow-trace/$GITHUB_JOB/$GITHUB_ACTION\";
      mkdir -p \"$(dirname \"$__wt_t\")\";
      printf 'sha %s\nlines %s\n' \"$GITHUB_SHA\" \"$(grep -c '' \"$0\")\" > \"$__wt_t\";
      __wt_s=\"$0\";
      set -T;
      trap 'if [ \"$BASH_SOURCE\" = \"$__wt_s\" ]; then echo \"$LINENO\" >> \"$__wt_t\"; fi' DEBUG;
      . \"$0\"" {0}

jobs:
  logs:
    name: logs
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # Its one limit: PROVISIONAL until the first run on CI is measured (#336).
      - name: The logs suite
        timeout-minutes: 10
        run: uv run --locked pytest -W error --suite logs -p no:cacheprovider
      # The same suite again under coverage, with no limit of its own, so the tracer is never
      # timed. When a pull request changes a file under tests/logs, or this file,
      # scripts/workflow_runs.py reads this report from a run on its commit, by the name below, and
      # the coverage gate counts it for tests/logs alone (MEASURED_ONLY_BY).
      - name: The logs suite, measured
        run: |
          mkdir -p "${RUNNER_TEMP}/coverage-logs"
          uv run --locked pytest -W error --suite logs -p no:cacheprovider --cov --cov-report="json:${RUNNER_TEMP}/coverage-logs/coverage.json"
          git rev-parse HEAD > "${RUNNER_TEMP}/coverage-logs/sha.txt"
      - name: Keep the logs suite's coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-logs
          path: ${{ runner.temp }}/coverage-logs
          if-no-files-found: error
          retention-days: 7
      # Every job keeps its steps' traces for the coverage job (#384), whatever the job's outcome.
      - name: Keep the workflow trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-trace-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/workflow-trace
          if-no-files-found: error
          retention-days: 7
