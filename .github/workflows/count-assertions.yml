# #568 / #570 probe, never merged: count what the runners execute. #570: the extension's
# integration suite, before and after, with each test's assertions and the builds it ran.
name: count-assertions

on:
  pull_request:
    branches: ["568/probe-base"]

permissions:
  contents: read

jobs:
  count:
    name: count (${{ matrix.label }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: develop-before-570
            sha: 1954940b29ecd652887d1276c0269e0b5f487c40
          - label: pr-571
            sha: bb08efb77cee1b7979969dc96cec59a59f3edd41
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: probe-src
      - name: Name the commit counted
        run: git rev-parse HEAD
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci --ignore-scripts
        working-directory: extension
      - run: sudo apt-get install -y strace
      - name: The integration suite, traced, counting each test's assertions
        working-directory: extension
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/counts"
          cp ../probe-src/probe/vitest.count.config.ts ../probe-src/probe/count-setup.ts .
          VITEST_COUNT_OUT="${RUNNER_TEMP}/counts/vitest-counts.jsonl" \
            strace -f -qq -e trace=openat -o "${RUNNER_TEMP}/counts/openat.trace" \
            npx vitest run --config vitest.count.config.ts --reporter=verbose 2>&1 \
            | tee "${RUNNER_TEMP}/counts/vitest.txt" | tail -35
          echo "builds (side-panel.js written):"
          grep -E 'side-panel\.js", O_WRONLY\|O_CREAT|side-panel\.js", O_RDWR\|O_CREAT' "${RUNNER_TEMP}/counts/openat.trace" | tee "${RUNNER_TEMP}/counts/builds.txt" | wc -l
      - name: Keep the counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: counts-${{ matrix.label }}
          path: ${{ runner.temp }}/counts
